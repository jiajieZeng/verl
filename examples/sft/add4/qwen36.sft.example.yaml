# Qwen3.6-35B-A3B 全参准备配置；填写路径后先验收一步，再设置正式步数。
# 可用于 train_add4_qwen36.py；OPD 用同一基础配置加 opd.qwen36.example.yaml。
defaults:
  - sft_trainer_engine
  - _self_
hydra:
  searchpath:
    - file://${oc.env:VERL_ROOT}/verl/trainer/config
model:
  path: ${oc.env:QWEN36_MODEL_DIR}
  tokenizer_path: ${oc.env:ADD_TOKENIZER_DIR}
  trust_remote_code: false
  enable_gradient_checkpointing: true
  use_remove_padding: true
  use_fused_kernels: true
  fused_kernel_options:
    impl_backend: torch
  override_config:
    attn_implementation: flash_attention_2
  lora_rank: 0
  lora:
    rank: 0
data:
  train_files: ${oc.env:ADD_TRAIN_FILES}
  val_files: null
  custom_cls:
    path: ${oc.env:VERL_ROOT}/examples/sft/add4/add4_sft_dataset.py
    name: Add4SFTDataset
  enable_thinking_default: false
  apply_chat_template_kwargs:
    enable_thinking: false
  pad_mode: no_padding
  max_length: 262144
  truncation: error
  train_batch_size: 32
  validation_batch_size: 8
  micro_batch_size_per_gpu: 1
  use_dynamic_bsz: true
  max_token_len_per_gpu: 262144
  num_workers: 4
engine:
  strategy: fsdp2
  fsdp_size: 8
  model_dtype: float32
  dtype: bfloat16
  # 全参FP32主权重/梯度/Adam按35B总参数计；CPU offload需充足主存。
  offload_policy: true
  param_offload: false
  optimizer_offload: false
  reshard_after_forward: true
  ulysses_sequence_parallel_size: 1
  use_torch_compile: false
  use_no_sync_for_gradient_accumulation: false
  pad_to_length: false
optim:
  optimizer: AdamW
  optimizer_impl: torch.optim
  lr: 1.0e-6
  lr_scheduler_type: constant
  lr_warmup_steps: 0
  lr_warmup_steps_ratio: 0.0
  weight_decay: 0.01
  clip_grad: 1.0
  override_optimizer_config:
    foreach: false
trainer:
  project_name: codemem-add4-qwen36
  experiment_name: ${oc.env:ADD_RUN_ID}
  default_local_dir: ${oc.env:ADD_RUN_DIR}/checkpoints
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 1
  total_training_steps: 1
  save_freq: 1
  test_freq: -1
  logger: [console]
  resume_mode: disable
  max_ckpt_to_keep: null
checkpoint:
  save_contents: [model, optimizer, extra]
  load_contents: [model, optimizer, extra]
